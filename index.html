<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Measurement photos for Vinted and eBay: type in your tape measurements, line them up on the photo, blur faces, and save portrait or square listing photos.">
<meta name="theme-color" content="#f4c430">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dimsum">
<title>Dimsum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a working bench. Tape-measure strip on top, wardrobe grid of pinned photos; the editor is a photo stage with a cutting-table side panel. */
:root{
  --bg:#eceff2; --surface:#ffffff; --sunk:#e1e6eb; --ink:#16202a; --muted:#56626f; --line:#cfd6de;
  --tape:#f4c430; --tape-ink:#2a2000; --danger:#b3261e; --ok:#21714a;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#18202a; --sunk:#121920; --ink:#e6ebf0; --muted:#97a3b0; --line:#2b3642;
  --tape:#f4c430; --tape-ink:#2a2000; --danger:#ff8a80; --ok:#7bd88f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#18202a; --sunk:#121920; --ink:#e6ebf0; --muted:#97a3b0; --line:#2b3642;
  --tape:#f4c430; --tape-ink:#2a2000; --danger:#ff8a80; --ok:#7bd88f; color-scheme:dark}

html,body{min-height:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variation-settings:"wdth" 100}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.tape{height:22px;background:
  repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 100%) 0 0/50px 22px no-repeat,
  repeating-linear-gradient(90deg,rgba(42,32,0,.85) 0 1px,transparent 1px 10px) 0 100%/100% 9px no-repeat,
  repeating-linear-gradient(90deg,rgba(42,32,0,.85) 0 1px,transparent 1px 50px) 0 100%/100% 15px no-repeat,
  var(--tape);
  border-bottom:1px solid rgba(0,0,0,.15)}
.wrap{zoom:var(--ui-zoom,1);max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:18px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--display);font-variation-settings:"wdth" 70;font-weight:800;font-size:30px;letter-spacing:-.01em;margin:0;line-height:1}
.brand span{color:var(--muted);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.chip.cloud i{background:var(--ok)} .chip.warn i{background:var(--danger)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.1;text-decoration:none;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--tape);color:var(--tape-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(.96)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px;flex:none}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

main{padding-block:8px 48px}
.lede{color:var(--muted);max-width:62ch;margin:4px 0 18px;font-size:14px}
.status{font-size:14px;color:var(--muted);margin:0 0 12px}
.status.err{color:var(--danger)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
.card:hover{border-color:var(--muted)}
.thumb{position:relative;aspect-ratio:4/5;background:var(--sunk);overflow:hidden;max-width:100%}
.thumb img,.thumb svg,.thumb canvas{position:absolute;inset:0;width:100%;height:100%}
.thumb img{object-fit:contain}
.thumb .tag{position:absolute;top:8px;left:8px;background:var(--tape);color:var(--tape-ink);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:4px}
.card .meta{padding:10px 12px 12px;display:grid;gap:4px;min-width:0}
.card .name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .kind{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card .nums{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;font-variant-numeric:tabular-nums}
.card .nums b{color:var(--ink);font-weight:500}
.addcard{border-style:dashed;align-items:center;justify-content:center;min-height:200px;gap:10px;color:var(--muted);padding:20px;text-align:center;cursor:default}
.addcard .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* Editor */
.edtop{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.edtop .name{flex:1 1 220px;min-width:0;font-family:var(--display);font-variation-settings:"wdth" 80;font-weight:700;font-size:22px;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px}
.edtop .name:hover,.edtop .name:focus{border-color:var(--line);background:var(--surface)}
select,input[type=number],input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
textarea{width:100%;min-height:70px;resize:vertical;overflow-y:hidden}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px;min-height:38px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.banner{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tape);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}

.edmain{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto 1fr;grid-template-areas:"stage side" "listing side";gap:20px;align-items:start}
.edmain > .stagecol{grid-area:stage;min-width:0} .edmain > .side{grid-area:side} .edmain > .listing{grid-area:listing;min-width:0}
@media (max-width:860px){.edmain{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"stage" "side" "listing"}}
a.btn{color:var(--ink)} a.btn.primary{color:var(--tape-ink)}
.stage{background:var(--sunk);border-radius:var(--r);display:flex;justify-content:center;align-items:center;padding:10px;min-width:0;position:relative}
.stage canvas{display:block;touch-action:none;border-radius:4px;max-width:100%}
.hint{font-size:14px;color:var(--muted);margin:8px 2px 0}
aside.side{display:grid;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
/* Long option text (garment names) must not widen a panel past the screen. */
select{max-width:100%;min-width:0;text-overflow:ellipsis}
.panel > *{min-width:0;overflow-wrap:anywhere}
.edmain > .side{min-width:0}
.panel h2{margin:0;flex-wrap:wrap;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.scaleline{font-size:14px}
.scaleline.none{color:var(--danger)}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row2 > *{min-width:0}
.mlist{display:grid;gap:2px;margin:0 -6px}
.m{border-radius:8px;padding:6px;display:grid;gap:8px}
.m.sel{background:var(--sunk)}
.mhead{display:flex;align-items:center;gap:10px;min-height:40px}
.mname{border:0;background:none;padding:6px 0;text-align:left;cursor:pointer;font-size:15px}
.mname:hover{text-decoration:underline;text-underline-offset:3px}
.mnum{width:86px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.munit{width:24px;color:var(--muted);font-size:14px}
details.panel{display:block}
/* Collapsible panels (same pattern as Porter): the whole header is the button; the round chevron fills and flips when open. */
.panel[data-pkey] > h2{display:block}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;margin:-6px 0;padding:0;border:0;background:none;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;text-align:left;cursor:pointer}
.ptitle{flex:1;min-width:0}
.phead .toggle{flex:none;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);color:var(--ink);transition:background .15s,color .15s}
.phead .toggle svg{width:22px;height:22px;transition:transform .2s}
.phead[aria-expanded=true] .toggle{background:var(--ink);color:var(--bg)}
.phead[aria-expanded=true] .toggle svg{transform:rotate(180deg)}
.phead:focus-visible{outline:none}.phead:focus-visible .toggle{box-shadow:0 0 0 3px var(--tape)}
.pbody{display:grid;gap:10px;grid-template-columns:minmax(0,1fr);min-width:0}
.pbody > *{min-width:0;max-width:100%;overflow-wrap:anywhere}
.pbody[hidden]{display:none}
.panel .inner{display:grid;gap:10px}
details.panel summary{cursor:pointer;font-weight:600;font-size:14px}
details.panel .inner{display:grid;gap:10px;margin-top:10px}
label.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
label.check input{width:18px;height:18px}
.sw{width:14px;height:14px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.mname{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mval{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.mval small{font-family:var(--body);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:6px;font-weight:600}
.mhow{color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;margin-left:auto}
.mname{display:flex;align-items:center;gap:8px}
.mlabel{overflow:hidden;text-overflow:ellipsis}
.mbody{display:grid;gap:8px;padding:0 0 4px 24px;font-size:14px}
.mbody .how{color:var(--muted)}
.mbody label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mbody input[type=number]{width:96px}
.mbody input[type=text]{flex:1 1 140px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px dashed var(--muted);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;min-height:36px}
.chips button:hover{border-style:solid}
.note{font-size:14px;color:var(--muted);line-height:1.45}
.ai-status{font-size:14px;color:var(--muted)}
.ai-status.err{color:var(--danger)}
.toastbtn{margin-left:8px;background:var(--tape);color:var(--tape-ink);border:0;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer;min-height:34px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
.ptabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px}
.ptab{flex:none;display:grid;gap:4px;justify-items:center;border:2px solid transparent;border-radius:9px;padding:3px;background:none;cursor:pointer;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ptab img{width:56px;height:70px;object-fit:cover;border-radius:6px;background:var(--sunk);display:block}
.ptab[aria-current=true]{border-color:var(--tape);color:var(--ink)}
.ptab.add{border:1px dashed var(--muted);width:66px;min-height:96px;align-content:center;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600}
.ptab.add svg{width:20px;height:20px}
.mon{width:18px;height:18px;flex:none;margin:0;accent-color:var(--ink)}
.emptystage{display:grid;gap:12px;justify-items:center;padding:40px 16px;text-align:center;color:var(--muted)}
.offer{border-left:4px solid var(--tape);padding:8px 10px;background:var(--sunk);border-radius:6px;font-size:14px}
#status{margin:0 0 12px}
#f-title{width:100%}
.condchips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-style:solid;border-color:var(--ink)}
.descparts{display:flex;flex-wrap:wrap;gap:4px 16px}
.descparts .check{font-size:15px}
.detailgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.detailgrid label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.detailgrid input{width:100%;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);font-size:15px}
.descprev{margin:0;white-space:pre-wrap;font-family:var(--body);font-size:14px;line-height:1.5;background:var(--sunk);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.lbl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:-4px}
.guess{border:1px solid var(--line);border-left:4px solid var(--tape);border-radius:8px;padding:10px 12px;display:grid;gap:8px;background:var(--sunk);font-size:14px;min-width:0}
.guess .gh{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.guess dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0}
.guess dt{color:var(--muted)} .guess dd{margin:0;overflow-wrap:anywhere}
.guess p{margin:0;white-space:pre-wrap}
.cvwrap{position:relative;display:inline-block;line-height:0;max-width:100%}
.rotbar{position:absolute;right:8px;top:8px;display:flex;gap:8px;z-index:2}
.cvwrap.dragging .iconbtn{opacity:.2;pointer-events:none}
.iconbtn.dlbtn{position:absolute;right:8px;bottom:8px;z-index:2;background:var(--tape);color:var(--tape-ink);border-color:rgba(0,0,0,.25)}
.iconbtn.dlbtn:hover{background:var(--tape);filter:brightness(.95)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:rgba(22,32,42,.78);color:#fff;border:1px solid rgba(255,255,255,.4);padding:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.iconbtn:hover{background:rgba(22,32,42,.92)}
.iconbtn svg{width:22px;height:22px}
.iconbtn[disabled]{opacity:.5}
.quickdims{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.qd{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px;min-width:0;cursor:text}
.qd .qn{font-weight:600;font-size:14px;white-space:nowrap}
.qd .qnum{width:62px;min-height:36px;padding:4px 8px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.qd{flex-wrap:wrap}
.qd .qu{color:var(--muted);font-size:14px}
.qd .qeye{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;margin:-2px -4px -2px 0;border:0;background:none;color:var(--muted);border-radius:8px;cursor:pointer;padding:0}
.qd .qeye svg{width:20px;height:20px}
.qd .qeye:hover{background:var(--line)}
.qd.off .sw{opacity:.25}
.seg.lstyle button{min-height:44px}
.qd.off .qn{color:var(--muted);text-decoration:line-through}
.qd.flash{border-color:var(--tape);box-shadow:0 0 0 3px var(--tape)}
@media (prefers-reduced-motion:no-preference){.qd{transition:box-shadow .3s,border-color .3s}}
.progress{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;zoom:var(--ui-zoom,1)}
.progress .ptitle{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.progress .ptitle strong{font-size:16px}
.progress .bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;background:var(--tape);transition:width .25s}
.progress .pgrid{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.pthumb{position:relative;flex:none;width:56px;height:70px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .2s}
.pthumb.wait img{opacity:.35}
.pthumb .pnum{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:var(--muted);font-size:15px}
.pthumb.work img{opacity:.7}
.pthumb.work::after{content:"";position:absolute;inset:50% auto auto 50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:3px solid rgba(255,255,255,.5);border-top-color:#fff;animation:spin .8s linear infinite;box-sizing:border-box;filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
.pthumb.done::after{content:"✓";position:absolute;right:3px;bottom:3px;width:20px;height:20px;border-radius:50%;background:#21714a;color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;line-height:1}
.pthumb.fail::after{content:"!";position:absolute;right:3px;bottom:3px;width:20px;height:20px;border-radius:50%;background:#b3261e;color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pthumb.work::after{animation:none}.progress .bar i{transition:none}}
.batchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tape);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.sortbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;margin-bottom:8px;background:var(--bg);border-bottom:1px solid var(--line)}
.sortmini{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.sortmini figure{margin:0;display:grid;gap:4px}
.sortmini img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px;background:var(--sunk);display:block}
.sortmini figcaption{font-size:13px;color:var(--muted);text-align:center}
.sortlist{display:grid;gap:16px}
.sortgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.sortcard{display:grid;gap:6px;min-width:0}
.sortcard img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px;background:var(--sunk);display:block}
.sortcard select{width:100%;min-height:38px;padding:4px 8px;font-size:14px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:28px}
</style>

</head>
<body>
<div class="tape" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Dimsum</h1><span>measurement photos for Vinted and eBay</span></div>
    <span class="chip" id="store-chip"><i></i><span>Connecting…</span></span>
  </header>
  <p id="status" class="status" hidden></p>
  <main id="app"></main>
</div>

    if (b.dataset.armed) return fn();
    b.dataset.armed = "1"; const old = b.textContent; b.textContent = label;
    setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = old; } }, 3500);
  };
  if (act === "back") { S.batch = null; go("list"); }
  else if (act === "batch-next") openBatch(S.batch.ids.indexOf(it.id) + 1);
  else if (act === "batch-prev") openBatch(S.batch.ids.indexOf(it.id) - 1);
  else if (act === "batch-done") { const n = S.batch.ids.length; S.batch = null; go("list"); toast(`All ${n} garments done.`); }
  else if (act === "copy") copyText();
  else if (act === "saveall") saveListing(true);
  else if (act === "shareall") saveListing(true, "share");
  else if (act === "shareready") { const f = S.ready; S.ready = null; renderReady(); shareFiles(f); }
  else if (act === "copytitle") track("title-copied"), copyString(it.name && it.name !== "Untitled garment" ? it.name : "", "Title copied", "Give the garment a title first.");
  else if (act === "saveone") saveListing(false);
  else if (act === "auto") autoPlace();
  else if (act === "faces") { track("find-faces"); findFaces(); }
  else if (act === "unmirror") {
    b.disabled = true; track("unmirror");
    unmirrorPhoto(it, ph).then(() => { scheduleSave(it); renderEditor(); toast(ph.mirrored ? "Un-mirrored" : "Flipped back"); }).catch(e => { toast(e.message); b.disabled = false; });
  }
  else if (act === "togglelines") { ph.hideLines = !ph.hideLines; S.sel = null; renderSide(); draw(); scheduleSave(it); toast(ph.hideLines ? "Lines hidden on this photo, including saved photos" : "Lines shown again"); }
  else if (act === "resetlines") { for (const id of Object.keys(ph.lines)) { const m = it.measures.find(m => m.id === id); if (m) ph.lines[id] = defaultLine(it, m); } ph.linesMoved = false; S.sel = null; draw(); updateValues(); scheduleSave(it); toast("Lines put back in their starting places"); }
  else if (act === "rot-l" || act === "rot-r") {
    track("rotate");
    if (it.example) { toast("The example photos can't be rotated."); return; }
    b.disabled = true;
    rotatePhoto(it, ph, act === "rot-l" ? 270 : 90).then(() => {
      scheduleSave(it); renderEditor();
      if (!ph.linesMoved && Object.keys(ph.lines).length) toast("Lines turned with the photo. If they're now sideways, tap Reset lines under the photo.");
    }).catch(e => { toast(e.message); b.disabled = false; });
  }
  else if (act === "guess") { it.guessErr = ""; suggestListing(false); }
  else if (act === "use-all") useGuess("all");
  else if (act === "use-title") useGuess("title");
  else if (act === "use-type") useGuess("type");
  else if (act === "use-desc") useGuess("desc");
  else if (act === "addblur") { const r = { id: uid(), x: .4, y: .1, w: .2, h: .2 }; ph.redact.push(r); S.sel = "r:" + r.id; renderSide(); draw(); scheduleSave(it); }
  else if (act === "delblur") { ph.redact = ph.redact.filter(r => "r:" + r.id !== S.sel); S.sel = null; renderSide(); draw(); scheduleSave(it); }
  else if (act === "delphoto") twoTap("Tap again to delete this photo", () => {
    const gone = it.photos.splice(S.pi, 1)[0];
    S.pi = Math.max(0, S.pi - 1); S.sel = null; scheduleSave(it); renderEditor();
  });
  else if (act === "delete") twoTap("Tap again to delete for good", () => removeItem(it));
});
document.addEventListener("visibilitychange", () => { if (document.hidden) flushSave(); });

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
track("/");
S.example = makeExample();
render();
initStore();
})();
</script>
