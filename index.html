<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Measurement photos for Vinted and eBay: type in your tape measurements, line them up on the photo, blur faces, and save portrait or square listing photos.">
<meta name="theme-color" content="#f4c430">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dimsum">
<title>Dimsum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a working bench. Tape-measure strip on top, wardrobe grid of pinned photos; the editor is a photo stage with a cutting-table side panel. */
:root{
  --bg:#eceff2; --surface:#ffffff; --sunk:#e1e6eb; --ink:#16202a; --muted:#56626f; --line:#cfd6de;
  --tape:#f4c430; --tape-ink:#2a2000; --danger:#b3261e; --ok:#21714a;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#18202a; --sunk:#121920; --ink:#e6ebf0; --muted:#97a3b0; --line:#2b3642;
  --tape:#f4c430; --tape-ink:#2a2000; --danger:#ff8a80; --ok:#7bd88f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#18202a; --sunk:#121920; --ink:#e6ebf0; --muted:#97a3b0; --line:#2b3642;
  --tape:#f4c430; --tape-ink:#2a2000; --danger:#ff8a80; --ok:#7bd88f; color-scheme:dark}

html,body{min-height:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variation-settings:"wdth" 100}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.tape{height:22px;background:
  repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 100%) 0 0/50px 22px no-repeat,
  repeating-linear-gradient(90deg,rgba(42,32,0,.85) 0 1px,transparent 1px 10px) 0 100%/100% 9px no-repeat,
  repeating-linear-gradient(90deg,rgba(42,32,0,.85) 0 1px,transparent 1px 50px) 0 100%/100% 15px no-repeat,
  var(--tape);
  border-bottom:1px solid rgba(0,0,0,.15)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:18px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--display);font-variation-settings:"wdth" 70;font-weight:800;font-size:30px;letter-spacing:-.01em;margin:0;line-height:1}
.brand span{color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.chip.cloud i{background:var(--ok)} .chip.warn i{background:var(--danger)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.1;text-decoration:none;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--tape);color:var(--tape-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(.96)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px;flex:none}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

main{padding-block:8px 48px}
.lede{color:var(--muted);max-width:62ch;margin:4px 0 18px;font-size:14px}
.status{font-size:13px;color:var(--muted);margin:0 0 12px}
.status.err{color:var(--danger)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
.card:hover{border-color:var(--muted)}
.thumb{position:relative;aspect-ratio:4/5;background:var(--sunk);overflow:hidden;max-width:100%}
.thumb img,.thumb svg,.thumb canvas{position:absolute;inset:0;width:100%;height:100%}
.thumb img{object-fit:contain}
.thumb .tag{position:absolute;top:8px;left:8px;background:var(--tape);color:var(--tape-ink);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:4px}
.card .meta{padding:10px 12px 12px;display:grid;gap:4px;min-width:0}
.card .name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .kind{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card .nums{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;font-variant-numeric:tabular-nums}
.card .nums b{color:var(--ink);font-weight:500}
.addcard{border-style:dashed;align-items:center;justify-content:center;min-height:200px;gap:10px;color:var(--muted);padding:20px;text-align:center;cursor:default}
.addcard .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* Editor */
.edtop{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.edtop .name{flex:1 1 220px;min-width:0;font-family:var(--display);font-variation-settings:"wdth" 80;font-weight:700;font-size:22px;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px}
.edtop .name:hover,.edtop .name:focus{border-color:var(--line);background:var(--surface)}
select,input[type=number],input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
textarea{width:100%;min-height:70px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;min-height:38px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.banner{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tape);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}

.edmain{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto 1fr;grid-template-areas:"stage side" "listing side";gap:20px;align-items:start}
.edmain > .stagecol{grid-area:stage;min-width:0} .edmain > .side{grid-area:side} .edmain > .listing{grid-area:listing;min-width:0}
@media (max-width:860px){.edmain{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"stage" "side" "listing"}}
a.btn{color:var(--ink)} a.btn.primary{color:var(--tape-ink)}
.stage{background:var(--sunk);border-radius:var(--r);display:flex;justify-content:center;align-items:center;padding:10px;min-width:0;position:relative}
.stage canvas{display:block;touch-action:none;border-radius:4px;max-width:100%}
.hint{font-size:12px;color:var(--muted);margin:8px 2px 0}
aside.side{display:grid;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.panel h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.scaleline{font-size:13px}
.scaleline.none{color:var(--danger)}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row2 > *{min-width:0}
.mlist{display:grid;gap:2px;margin:0 -6px}
.m{border-radius:8px;padding:6px;display:grid;gap:8px}
.m.sel{background:var(--sunk)}
.mhead{display:flex;align-items:center;gap:10px;min-height:40px}
.mname{border:0;background:none;padding:6px 0;text-align:left;cursor:pointer;font-size:15px}
.mname:hover{text-decoration:underline;text-underline-offset:3px}
.mnum{width:86px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.munit{width:22px;color:var(--muted);font-size:13px}
details.panel{display:block}
details.panel summary{cursor:pointer;font-weight:600;font-size:14px}
details.panel .inner{display:grid;gap:10px;margin-top:10px}
label.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
label.check input{width:18px;height:18px}
.sw{width:14px;height:14px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.mname{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mval{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.mval small{font-family:var(--body);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:6px;font-weight:600}
.mbody{display:grid;gap:8px;padding:0 0 4px 24px;font-size:13px}
.mbody .how{color:var(--muted)}
.mbody label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mbody input[type=number]{width:96px}
.mbody input[type=text]{flex:1 1 140px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px dashed var(--muted);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;min-height:32px}
.chips button:hover{border-style:solid}
.note{font-size:12px;color:var(--muted)}
.ai-status{font-size:13px;color:var(--muted)}
.ai-status.err{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
.ptabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px}
.ptab{flex:none;display:grid;gap:4px;justify-items:center;border:2px solid transparent;border-radius:9px;padding:3px;background:none;cursor:pointer;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ptab img{width:56px;height:70px;object-fit:cover;border-radius:6px;background:var(--sunk);display:block}
.ptab[aria-current=true]{border-color:var(--tape);color:var(--ink)}
.ptab.add{border:1px dashed var(--muted);width:66px;min-height:96px;align-content:center;text-transform:none;letter-spacing:0;font-size:12px;font-weight:600}
.ptab.add svg{width:20px;height:20px}
.mon{width:18px;height:18px;flex:none;margin:0;accent-color:var(--ink)}
.emptystage{display:grid;gap:12px;justify-items:center;padding:40px 16px;text-align:center;color:var(--muted)}
.offer{border-left:4px solid var(--tape);padding:8px 10px;background:var(--sunk);border-radius:6px;font-size:13px}
#status{margin:0 0 12px}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:-4px}
.guess{border:1px solid var(--line);border-left:4px solid var(--tape);border-radius:8px;padding:10px 12px;display:grid;gap:8px;background:var(--sunk);font-size:14px;min-width:0}
.guess .gh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.guess dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0}
.guess dt{color:var(--muted)} .guess dd{margin:0;overflow-wrap:anywhere}
.guess p{margin:0;white-space:pre-wrap}
.batchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tape);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.sortlist{display:grid;gap:16px}
.sortgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.sortcard{display:grid;gap:6px;min-width:0}
.sortcard img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px;background:var(--sunk);display:block}
.sortcard select{width:100%;min-height:38px;padding:4px 8px;font-size:14px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:28px}
</style>

</head>
<body>
<div class="tape" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Dimsum</h1><span>measurement photos for Vinted and eBay</span></div>
    <span class="chip" id="store-chip"><i></i><span>Connecting…</span></span>
  </header>
  <p id="status" class="status" hidden></p>
  <main id="app"></main>
</div>
<input type="file" id="in-cam" accept="image/*" capture="environment" hidden>
<input type="file" id="in-lib" accept="image/*" multiple hidden>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const COLORS = ["#ffd23f", "#3ddbd9", "#ff6b6b", "#a593ff", "#7bd88f", "#ff9f43", "#f78fd0", "#8fd3ff"];
const REF_COLOR = "#ffffff";
const ROLES = { front: "Front", back: "Back", sizelabel: "Size label", material: "Material label", detail: "Detail", worn: "Worn" };

const T = (key, label, a, b, how, optional = false) => ({ key, label, a, b, how, optional });
const TEMPLATES = {
  coat: { name: "Coat / jacket", measures: [
    T("p2p", "Pit to pit", [.27,.33], [.73,.33], "Straight across the chest, armpit seam to armpit seam. Double it for the chest."),
    T("length", "Length", [.5,.10], [.5,.92], "Centre back, from the collar seam straight down to the hem."),
    T("sleeve", "Sleeve", [.69,.16], [.86,.66], "From the shoulder seam along the top of the sleeve to the cuff edge."),
    T("shoulder", "Shoulders", [.31,.16], [.69,.16], "Across the back, shoulder seam to shoulder seam.", true),
    T("hem", "Hem width", [.26,.92], [.74,.92], "Straight across the bottom edge, laid flat.", true),
  ]},
  shirt: { name: "Shirt / T-shirt", measures: [
    T("length", "Length", [.5,.08], [.5,.92], "From the top of the collar seam at the back down to the hem."),
    T("p2p", "Pit to pit", [.27,.32], [.73,.32], "Straight across the chest, armpit seam to armpit seam."),
    T("shoulder", "Shoulders", [.31,.15], [.69,.15], "Shoulder seam to shoulder seam."),
    T("sleeve", "Sleeve", [.69,.15], [.86,.62], "Shoulder seam to cuff edge, along the top of the sleeve."),
    T("hem", "Hem width", [.27,.92], [.73,.92], "Straight across the bottom edge."),
  ]},
  knit: { name: "Jumper / knitwear", measures: [

    T("p2p", "Pit to pit", [.27,.32], [.73,.32], "Straight across the chest, armpit to armpit."),
    T("shoulder", "Shoulders", [.31,.15], [.69,.15], "Shoulder seam to shoulder seam."),

  ]},

    T("inseam", "Leg", [.52,.37], [.63,.95], "The inside leg: from the crotch seam down the inner seam to the hem."),
    T("rise", "Front rise", [.5,.07], [.5,.36], "From the crotch seam up to the top of the waistband.", true),
    T("outseam", "Outseam", [.30,.07], [.33,.95], "From the top of the waistband down the outside leg to the hem.", true),
    T("thigh", "Thigh", [.28,.41], [.49,.41], "Across one leg, about 2 cm below the crotch.", true),
    T("opening", "Leg opening", [.60,.95], [.75,.95], "Across the leg opening at the hem.", true),
  ]},
  skirt: { name: "Skirt", measures: [
    T("waist", "Waist (flat)", [.30,.08], [.70,.08], "Across the waistband, laid flat. Double it for the full waist."),
    T("hip", "Hip (flat)", [.26,.30], [.74,.30], "Across the widest part of the hip, about 18 cm below the waistband."),
    T("length", "Length", [.5,.08], [.5,.92], "From the top of the waistband down to the hem."),
    T("hem", "Hem width", [.2,.92], [.8,.92], "Straight across the bottom edge."),
  ]},
  dress: { name: "Dress", measures: [
    T("length", "Length", [.42,.06], [.42,.94], "From the highest point of the shoulder straight down to the hem."),
    T("p2p", "Pit to pit", [.3,.28], [.7,.28], "Straight across the chest, armpit to armpit."),
    T("waist", "Waist (flat)", [.32,.45], [.68,.45], "Across the narrowest part of the waist, laid flat."),
    T("hem", "Hem width", [.22,.94], [.78,.94], "Straight across the bottom edge."),
  ]},
  other: { name: "Something else", measures: [] },
};
const HOW = {};
for (const t of Object.values(TEMPLATES)) for (const m of t.measures) HOW[m.key] = HOW[m.key] || m.how;

const APP_VERSION = "2026-11-08.5";
const FITS = { trousers: ["Skinny", "Slim", "Regular", "Loose"] };
const fitOf = it => FITS[it.type] && FITS[it.type].includes(it.fit) ? it.fit : "";
const SIZES = { shirt: ["XS", "S", "M", "L", "XL", "XXL"], knit: ["XS", "S", "M", "L", "XL", "XXL"] };
const sizeOf = it => SIZES[it.type] && SIZES[it.type].includes(it.size) ? it.size : "";
const tagsOf = it => [sizeOf(it) && "Size " + sizeOf(it), fitOf(it) && fitOf(it) + " fit"].filter(Boolean);
const SIZE_WORDS = { "extra small": "XS", "small": "S", "medium": "M", "large": "L", "extra large": "XL", "xxl": "XXL", "2xl": "XXL" };
function sizeFromText(txt) {
  const t = String(txt || "").trim().toLowerCase(); if (!t) return "";
  if (SIZE_WORDS[t]) return SIZE_WORDS[t];
  const m = t.toUpperCase().match(/\b(XXL|XL|XS|S|M|L)\b/); return m ? m[1] : "";
}
const PRESETS = {
  card: { label: "Bank card (long edge)", len: 8.56 },
  a4l: { label: "A4 paper (long edge)", len: 29.7 },
  a4s: { label: "A4 paper (short edge)", len: 21.0 },
  letter: { label: "US Letter (long edge)", len: 27.94 },
  ruler: { label: "30 cm ruler", len: 30 },
  custom: { label: "Something else", len: null },
};

// ---------- state ----------
const S = {
  mode: "pending", items: [], loaded: false, loadErr: "", view: "list",
  cur: null, pi: 0, sel: null, example: null, exp: { shape: "45", strip: true, clean: false }, sort: null,
  canImages: false,
  pick: null, busy: false, ready: null,
};
const canFaces = () => true;
try { Object.assign(S.exp, JSON.parse(localStorage.getItem("dimsum.exp") || "{}")); } catch {}
function saveExp() { try { localStorage.setItem("dimsum.exp", JSON.stringify(S.exp)); } catch {} }
const KEY_NAME = "dimsum.claudeKey";
function getKey() { try { return localStorage.getItem(KEY_NAME) || ""; } catch { return ""; } }
function setKey(v) { try { v ? localStorage.setItem(KEY_NAME, v) : localStorage.removeItem(KEY_NAME); } catch {} S.canImages = !!v; }
S.canImages = !!getKey();
const API_VERSION = "2026-10-21";
function blobToB64(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(r.error); r.readAsDataURL(blob); }); }
async function callClaude(prompt, blobs, schema, effort = "medium") {
  const imgs = Array.isArray(blobs) ? blobs : [blobs];
  const imageBlocks = await Promise.all(imgs.map(async b => ({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: await blobToB64(b) } })));
  const key = getKey(); if (!key) throw new Error("Add your Claude API key on the wardrobe page first.");
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {

    }
    if (best) return best;

      if (Math.hypot((r.x + r.w) * CV.w - p.x, (r.y + r.h) * CV.h - p.y) < R) return { id: "r:" + r.id, box: r, end: "resize" };

      refMsg = ` Found a ${PRESETS[preset].label.toLowerCase()} for estimates.`;
    }
    renderSide(); draw(); scheduleSave(it);
    const s2 = $("#ai-status"); if (s2) s2.textContent = `Placed ${n} of ${on.length} lines.${refMsg} ${r.note || ""} Check each dot before you save.`;
  } catch (e) {
    const s2 = $("#ai-status"); if (s2) { s2.className = "ai-status err"; s2.textContent = claudeErr(e); }
  } finally { const b = $("#btn-auto"); if (b) b.disabled = false; }
}
function padBox(b, f = .22) {
  const px = b.w * f, py = b.h * f;
  const x = clamp(b.x - px, 0, 1), y = clamp(b.y - py * 1.3, 0, 1);
  return { id: uid(), x, y, w: clamp(b.w + 2 * px, .01, 1 - x), h: clamp(b.h + py * 2.3, .01, 1 - y) };
}
async function findFaces() {
  const it = S.cur, ph = curPhoto(), btn = $("#btn-faces"), st = $("#face-status");
  btn.disabled = true; st.className = "ai-status"; st.textContent = "Looking for faces on this device… (the first time downloads a small face finder)";
  try {
    const img = await loadImg(ph);
    let boxes = [], how = "";
    try { boxes = await detectFacesOnDevice(img); how = "device"; }
    catch { how = "nodevice"; }
    if (!boxes.length && S.canImages) {
      const s1 = $("#face-status"); if (s1) s1.textContent = "Nothing found on the device. Asking Claude to double-check…";
      const { blob } = await photoBlobForClaude(ph, 1600);
      const r = await callClaude(`Find every human face in this photo, including faces reflected in a mirror, partly hidden, small in the background, or turned away (then box the head). Give each as a box with x and y of its top-left corner and its width w and height h, all as fractions of the image width and height (0 to 1). Return an empty list if there are no faces.`, blob, FACE_SCHEMA, "low");
      boxes = (r.faces || []).filter(b => [b.x, b.y, b.w, b.h].every(v => typeof v === "number" && v >= -0.05 && v <= 1.05) && b.w > 0 && b.h > 0);
      how = "claude";
    }
    if (curPhoto() !== ph) return;
    ph.faceChecked = true;
    const add = boxes.map(b => padBox(b));
    ph.redact.push(...add);
    if (add.length) S.sel = "r:" + add[0].id;
    renderSide(); draw(); scheduleSave(it);
    const s2 = $("#face-status");
    if (s2) s2.textContent = add.length ? `Blurred ${add.length} face${add.length > 1 ? "s" : ""}. Check the boxes cover them; drag the corner dot to make one bigger.`
      : how === "nodevice" ? "The face finder couldn't load (it needs a connection the first time). Add a blur box by hand instead."
      : "No faces found. If someone is in shot, add a blur box over them." + (S.canImages ? "" : " Faces that are small or turned away can be missed.");
  } catch (e) {
    const s2 = $("#face-status"); if (s2) { s2.className = "ai-status err"; s2.textContent = claudeErr(e); }
  } finally { const b = $("#btn-faces"); if (b) b.disabled = false; }
}

// ---------- sorting a batch of photos into garments ----------
const ROLE_ORDER = ["front", "back", "detail", "worn", "sizelabel", "material"];
function startSort(photos, files) {
  // Without Claude: start a new garment whenever photos were taken more than 5 minutes apart.
  let g = 1, last = null;
  const items = photos.map((p, i) => {
    const t = files[i].lastModified || 0;
    if (last != null && t && Math.abs(t - last) > 5 * 60 * 1000) g++;
    if (t) last = t;
    return { p, g, role: "front", url: URL.createObjectURL(p.blob) };
  });
  const byG = {};
  for (const x of items) { byG[x.g] = (byG[x.g] || 0) + 1; x.role = ["front", "back", "sizelabel", "material"][byG[x.g] - 1] || "detail"; }
  const groups = new Set(items.map(x => x.g)).size;
  S.sort = { photos: items, types: {}, busy: false,
    status: S.canImages ? "" : groups > 1 ? `Split into ${groups} garments by the time each photo was taken. Check them below.` : "Add a Claude API key on the wardrobe page and Claude will sort photos of different garments for you." };
  S.view = "sort"; render(); window.scrollTo(0, 0);
  if (S.canImages) sortWithClaude();
}
function sortGroups() { const out = []; for (const x of S.sort.photos) if (!out.includes(x.g)) out.push(x.g); return out; }
function renderSort() {
  const st = S.sort, groups = sortGroups();
  const roleOpts = r => Object.entries(ROLES).map(([k, l]) => `<option value="${k}" ${r === k ? "selected" : ""}>${l}</option>`).join("");
  $("#app").innerHTML = `
    <div class="banner">You chose ${st.photos.length} photos. Check they're grouped by garment, then tap <b>Create</b>. To move a photo, change the garment under it.</div>
    <div class="ai-status${st.err ? " err" : ""}" id="sort-status" style="margin-bottom:12px">${esc(st.status)}</div>
    <div class="sortlist">
    ${groups.map((g, gi) => {
      const ps = st.photos.map((x, i) => [x, i]).filter(([x]) => x.g === g);
      return `<section class="panel">
        <h2>Garment ${gi + 1}${st.types[g] ? ` · ${esc(TEMPLATES[st.types[g]].name)}` : ""} <span style="text-transform:none;letter-spacing:0;font-weight:500">${ps.length} photo${ps.length > 1 ? "s" : ""}</span></h2>
        <div class="sortgrid">${ps.map(([x, i]) => `<div class="sortcard">
          <img src="${x.url}" alt="Photo ${i + 1}">
          <select data-sort-g="${i}" aria-label="Garment for photo ${i + 1}">${groups.map((gg, j) => `<option value="${gg}" ${gg === g ? "selected" : ""}>Garment ${j + 1}</option>`).join("")}<option value="new">New garment</option></select>
          <select data-sort-role="${i}" aria-label="What photo ${i + 1} shows">${roleOpts(x.role)}</select>
        </div>`).join("")}</div>
      </section>`;
    }).join("")}
    </div>
    <div class="row2" style="margin-top:16px">
      <button class="btn primary" data-sort-act="create" ${st.busy ? "disabled" : ""}>Create ${groups.length} garment${groups.length > 1 ? "s" : ""}</button>
      ${S.canImages ? `<button class="btn" data-sort-act="claude" ${st.busy ? "disabled" : ""}>${st.busy ? "Claude is sorting…" : "Sort again with Claude"}</button>` : ""}
      ${groups.length > 1 ? `<button class="btn" data-sort-act="one">Make it all one garment</button>` : ""}
      <button class="btn ghost" data-sort-act="cancel">Cancel</button>
    </div>`;
}
function photoThumb(url, max) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => { const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)); const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); c.toBlob(res, "image/jpeg", .8); };
    im.onerror = () => rej(new Error("A photo couldn't be read.")); im.src = url;
  });
}
const SORT_SCHEMA = { type: "object", additionalProperties: false, required: ["photos", "groups"], properties: {
  photos: { type: "array", items: { type: "object", additionalProperties: false, required: ["n", "group", "role"], properties: { n: { type: "integer" }, group: { type: "integer" }, role: { type: "string", enum: Object.keys(ROLES) } } } },
  groups: { type: "array", items: { type: "object", additionalProperties: false, required: ["group", "type"], properties: { group: { type: "integer" }, type: { type: "string", enum: Object.keys(TEMPLATES) } } } } } };
async function sortWithClaude() {
  const st = S.sort; if (!st || st.busy) return;
  st.busy = true; st.err = false; st.status = "Claude is working out which photos show the same garment…"; renderSort();
  try {
    const list = st.photos.slice(0, 40);
    const blobs = await Promise.all(list.map(x => photoThumb(x.url, 512)));
    const prompt = `These ${list.length} photos are numbered 1 to ${list.length}, in the order given. Someone selling second-hand clothes took them, and they may show several different garments.
Group the photos so each group shows one physical garment: its front, back, label or tag close-ups, details, or the garment being worn. Compare colour, fabric, pattern and features. A label close-up belongs with the garment photographed just before or after it, unless it clearly matches another garment.
Number groups from 1 in the order they first appear. For every photo give its number n, its group and its role: front, back, sizelabel (a close-up of the size tag), material (a close-up of the fabric or care label), detail, or worn. For every group give the closest garment type.`;
    const r = await callClaude(prompt, blobs, SORT_SCHEMA, "low");
    if (S.sort !== st) return;
    for (const q of r.photos || []) { const x = list[q.n - 1]; if (x && Number.isInteger(q.group) && q.group > 0) { x.g = q.group; if (ROLES[q.role]) x.role = q.role; } }
    st.types = {}; for (const q of r.groups || []) if (TEMPLATES[q.type]) st.types[q.group] = q.type;
    const n = sortGroups().length;
    st.status = `Claude found ${n} garment${n > 1 ? "s" : ""}. Check below and fix anything it got wrong.`;
  } catch (e) { st.status = e.message || "Claude couldn't sort these photos."; st.err = true; }
  finally { st.busy = false; if (S.sort === st && S.view === "sort") renderSort(); }
}
async function createFromSort() {
  const st = S.sort, made = [];
  for (const g of sortGroups()) {
    const photos = st.photos.filter(x => x.g === g).map(x => ({ ...x.p, role: x.role }))
      .sort((a, b) => ROLE_ORDER.indexOf(a.role) - ROLE_ORDER.indexOf(b.role));
    const fromName = guessFromNames(photos.map(p => p.fileName));
    const type = st.types[g] || fromName || "coat";
    const ni = { id: uid(), name: "Untitled garment", type, unit: "in", notes: "", measures: freshMeasures(type), photos, createdAt: Date.now(), updatedAt: Date.now() };
    const cover = photos.find(p => p.role === "front") || photos.find(p => !isLabelRole(p.role)) || photos[0];
    cover.lines = defaultLines(ni);
    if (!st.types[g] && fromName) ni.guess = { source: "name", type: fromName };
    try { await writeItem(ni); made.push(ni); } catch { toast("Couldn't save one of the garments. Storage may be full."); }
  }
  for (const x of st.photos) URL.revokeObjectURL(x.url);
  S.sort = null;
  if (made.length === 1) { open(made[0].id, true, made[0]); if (S.canImages) suggestListing(true); }
  else if (made.length) { S.batch = { ids: made.map(x => x.id) }; openBatch(0); }
  else { S.view = "list"; render(); }
}
document.addEventListener("change", e => {
  const t = e.target, st = S.sort; if (!st || S.view !== "sort") return;
  if (t.dataset.sortG !== undefined) {
    const x = st.photos[+t.dataset.sortG];
    x.g = t.value === "new" ? Math.max(...st.photos.map(y => y.g)) + 1 : +t.value;
    renderSort();
  } else if (t.dataset.sortRole !== undefined) st.photos[+t.dataset.sortRole].role = t.value;
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-sort-act]"); if (!b || !S.sort) return;
  const act = b.dataset.sortAct;
  if (act === "create") createFromSort();
  else if (act === "claude") sortWithClaude();
  else if (act === "one") { const g = S.sort.photos[0].g; S.sort.photos.forEach(x => x.g = g); renderSort(); }
  else if (act === "cancel") { for (const x of S.sort.photos) URL.revokeObjectURL(x.url); S.sort = null; S.view = "list"; render(); }
});

async function movePhoto(it, idx, target) {
  const ph = it.photos[idx]; if (!ph) return;
  const moved = { ...ph, lines: {}, ref: null };
  let dest;
  if (target === "new") {
    if (!isLabelRole(moved.role)) moved.role = "front";
    dest = { id: uid(), name: "Untitled garment", type: it.type, unit: it.unit, notes: "", measures: freshMeasures(it.type), photos: [], createdAt: Date.now(), updatedAt: Date.now() };
  } else {
    const src = S.items.find(x => x.id === target); if (!src) return;
    dest = { ...src, measures: structuredClone(src.measures), photos: src.photos.map(p => ({ ...p })) };
  }
  if (!isLabelRole(moved.role) && !dest.photos.some(p => Object.keys(p.lines || {}).length)) moved.lines = defaultLines(dest);
  dest.photos.push(moved); dest.updatedAt = Date.now();
  try { await writeItem(dest); } catch { toast("Couldn't move the photo. Storage may be full."); renderSide(); return; }
  it.photos.splice(idx, 1);
  it.updatedAt = Date.now(); savePending = it; await flushSave();
  if (S.batch && target === "new") S.batch.ids.push(dest.id);
  S.pi = Math.max(0, idx - 1); S.sel = null;
  renderEditor();
  toast(target === "new" ? (S.batch ? "Moved to a new garment, added to the end of this batch" : "Moved to a new garment in your wardrobe") : `Moved to "${dest.name}"`);
}
function openBatch(i) {
  const b = S.batch; if (!b) return;
  flushSave();
  const id = b.ids[i], obj = S.items.find(x => x.id === id); if (!obj) { S.batch = null; go("list"); return; }
  open(id, true, obj);
  if (S.canImages && !S.cur.guess) suggestListing(true);
}
function batchBar(it) {
  const b = S.batch; if (!b) return "";
  const i = b.ids.indexOf(it.id); if (i < 0) return "";
  const last = i === b.ids.length - 1;
  return `<div class="batchbar"><strong>Garment ${i + 1} of ${b.ids.length}</strong>
    <div class="row2">${i > 0 ? `<button class="btn ghost" data-act="batch-prev">Previous</button>` : ""}
    <button class="btn primary" data-act="${last ? "batch-done" : "batch-next"}">${last ? "Finish" : "Next garment"}</button></div></div>`;
}

// ---------- routing & events ----------
function render() {
  renderChip();
  if (S.view === "list") renderList(); else if (S.view === "sort") renderSort(); else renderEditor();
}
function go(view) {
  if (view === "list") { flushSave(); S.cur = null; S.sel = null; S.pi = 0; CV = null; window.onresize = null; }
  S.view = view; render(); window.scrollTo(0, 0);
}
function open(id, isNew = false, obj = null) {
  const src = obj || (id === "example" ? S.example : S.items.find(x => x.id === id)); if (!src) return;
  if (src.example) S.cur = src;
  else { S.cur = { ...src, measures: structuredClone(src.measures), photos: src.photos.map(p => ({ ...structuredClone({ ...p, blob: null }), blob: p.blob || null })) }; }
  S.cur.isNew = isNew; S.sel = null; S.pi = 0; S.ready = null; go("editor");
}
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-pick]"); if (!b) return;
  pick(b.dataset.pick, b.dataset.target);
});
const app = $("#app");
app.addEventListener("change", e => {
  const t = e.target, it = S.cur; if (!it) return;
  const ph = curPhoto();
  if (t.id === "f-strip") { S.exp.strip = t.checked; saveExp(); return; }
  if (t.id === "f-clean") { S.exp.clean = t.checked; saveExp(); renderSide(); return; }
  if (t.dataset.on) {
    const m = it.measures.find(m => m.id === t.dataset.on);
    if (t.checked) ph.lines[m.id] = defaultLine(it, m); else delete ph.lines[m.id];
    if (S.sel === m.id && !t.checked) S.sel = null;
    draw(); updateValues(); scheduleSave(it); return;
  }
  if (t.id === "f-move") { if (t.value) movePhoto(it, S.pi, t.value); return; }
  if (t.id === "f-role") { ph.role = t.value; if (isLabelRole(ph.role)) ph.lines = {}; S.sel = null; renderEditor(); scheduleSave(it); return; }
  if (t.id === "f-type") {
    setType(it, t.value);
    S.sel = null; renderSide(); draw(); scheduleSave(it);
    return;
  }
  if (t.id === "f-ref") {
    const p = t.value;
    if (!p) ph.ref = null;
    else if (ph.ref) { ph.ref.preset = p; ph.ref.len = PRESETS[p].len ?? ph.ref.len; }
    else ph.ref = { preset: p, len: PRESETS[p].len, a: [.4, .96], b: [.6, .96] };
    S.sel = ph.ref ? "ref" : null; renderSide(); draw(); scheduleSave(it);
  }
});
function parseNum(str) { const v = parseFloat(String(str).replace(",", ".").replace(/[^0-9.]/g, "")); return v > 0 ? v : null; }
function setActual(it, t) {
  const m = it.measures.find(m => m.id === t.dataset.actVal); if (!m) return;
  const v = parseNum(t.value); m.actual = v ? fromUnit(v, it.unit) : null;
  draw(); updateValues(); scheduleSave(it);
}
app.addEventListener("focusout", e => { const t = e.target; if (S.cur && t.dataset && t.dataset.actVal) { setActual(S.cur, t); flushSave(); } });
app.addEventListener("input", e => {
  const t = e.target, it = S.cur; if (!it) return;
  const ph = curPhoto();
  if (t.id === "f-name") { it.name = t.value; scheduleSave(it); }
  else if (t.id === "f-notes") { it.notes = t.value; scheduleSave(it); }
  else if (t.id === "f-desc") { it.description = t.value; scheduleSave(it); }
  else if (t.id === "f-reflen") { const v = parseFloat(t.value); ph.ref.len = v > 0 ? fromUnit(v, it.unit) : null; draw(); updateValues(); scheduleSave(it); }
  else if (t.dataset.lbl) { const m = it.measures.find(m => m.id === t.dataset.lbl); m.label = t.value; t.closest(".m").querySelector(".mname").textContent = t.value; draw(); scheduleSave(it); }
  else if (t.dataset.actVal) setActual(it, t);
});
app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.dataset.pick) return;
  if (b.dataset.open) return open(b.dataset.open);
  if (b.dataset.act === "savekey") { const v = $("#f-key").value.trim(); if (!v) { toast("Paste your key into the box first."); return; } setKey(v); toast("Key saved on this device"); renderList(); return; }
  if (b.dataset.act === "forgetkey") { setKey(""); toast("Key removed"); renderList(); return; }
  const it = S.cur; if (!it) return;
  const ph = curPhoto();
  if (b.dataset.redl !== undefined) { if (S.ready && S.ready[+b.dataset.redl]) downloadOne(S.ready[+b.dataset.redl]); return; }
  if (b.dataset.photo !== undefined) { S.pi = +b.dataset.photo; S.sel = null; renderEditor(); return; }
  if (b.dataset.sel) { S.sel = S.sel === b.dataset.sel ? null : b.dataset.sel; renderSide(); draw(); return; }
  if (b.dataset.size) { it.size = it.size === b.dataset.size ? "" : b.dataset.size; renderSide(); draw(); scheduleSave(it); return; }
  if (b.dataset.fit) { it.fit = it.fit === b.dataset.fit ? "" : b.dataset.fit; renderSide(); draw(); scheduleSave(it); return; }
  if (b.dataset.shape) { S.exp.shape = b.dataset.shape; saveExp(); renderSide(); return; }
  if (b.dataset.unit) { it.unit = b.dataset.unit; renderEditor(); scheduleSave(it); return; }
  if (b.dataset.del) { it.measures = it.measures.filter(m => m.id !== b.dataset.del); it.photos.forEach(p => delete p.lines[b.dataset.del]); S.sel = null; renderSide(); draw(); scheduleSave(it); return; }
  if (b.dataset.addm !== undefined) {
    const t = TEMPLATES[it.type].measures.find(x => x.key === b.dataset.addm);
    const m = t ? { id: uid(), key: t.key, label: t.label, actual: null, touched: false }
                : { id: uid(), key: "custom", label: "Custom " + (it.measures.filter(x => x.key === "custom").length + 1), actual: null, touched: true };
    it.measures.push(m); if (ph) ph.lines[m.id] = defaultLine(it, m);
    S.sel = m.id; renderSide(); draw(); scheduleSave(it); return;
  }
  const act = b.dataset.act;
  const twoTap = (label, fn) => {
    if (b.dataset.armed) return fn();
    b.dataset.armed = "1"; const old = b.textContent; b.textContent = label;
    setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = old; } }, 3500);
  };
  if (act === "back") { S.batch = null; go("list"); }
  else if (act === "batch-next") openBatch(S.batch.ids.indexOf(it.id) + 1);
  else if (act === "batch-prev") openBatch(S.batch.ids.indexOf(it.id) - 1);
  else if (act === "batch-done") { const n = S.batch.ids.length; S.batch = null; go("list"); toast(`All ${n} garments done.`); }
  else if (act === "copy") copyText();
  else if (act === "saveall") saveListing(true);
  else if (act === "shareall") saveListing(true, "share");
  else if (act === "shareready") { const f = S.ready; S.ready = null; renderReady(); shareFiles(f); }
  else if (act === "copytitle") copyString(it.name && it.name !== "Untitled garment" ? it.name : "", "Title copied", "Give the garment a title first.");

  else if (act === "use-all") useGuess("all");
  else if (act === "use-title") useGuess("title");
  else if (act === "use-type") useGuess("type");
  else if (act === "use-desc") useGuess("desc");
  else if (act === "addblur") { const r = { id: uid(), x: .4, y: .1, w: .2, h: .2 }; ph.redact.push(r); S.sel = "r:" + r.id; renderSide(); draw(); scheduleSave(it); }
  else if (act === "delblur") { ph.redact = ph.redact.filter(r => "r:" + r.id !== S.sel); S.sel = null; renderSide(); draw(); scheduleSave(it); }
  else if (act === "delphoto") twoTap("Tap again to delete this photo", () => {
    const gone = it.photos.splice(S.pi, 1)[0];
    S.pi = Math.max(0, S.pi - 1); S.sel = null; scheduleSave(it); renderEditor();
  });
  else if (act === "delete") twoTap("Tap again to delete for good", () => removeItem(it));
});
document.addEventListener("visibilitychange", () => { if (document.hidden) flushSave(); });

S.example = makeExample();
render();
initStore();
})();
